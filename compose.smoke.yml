services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: psht-kalsel-mvp
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
    ports:
      - "18080:8080"
    volumes:
      - psht-mvp-database:/var/www/html/database
      - psht-mvp-storage-public:/var/www/html/storage/app/public
      - psht-mvp-storage-private:/var/www/html/storage/app/private
      - psht-mvp-storage-logs:/var/www/html/storage/logs
volumes:
  psht-mvp-database:
  psht-mvp-storage-public:
  psht-mvp-storage-private:
  psht-mvp-storage-logs:
